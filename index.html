<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest">
<title>올영 직원 도우미 · DA22</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
<style>
:root{--bg:#f6f6f6;--card:#fff;--text:#171717;--muted:#777;--line:#e8e8e8;--accent:#111;--soft:#f0f0f0;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:32px}.top{padding:22px 18px 12px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}.top h1{font-size:20px;margin:0 0 4px}.top p{margin:0;color:var(--muted);font-size:12px}.screen{padding:18px}.home-grid{display:grid;gap:12px;margin-top:8px}.home-btn{background:#111;color:#fff;border:0;border-radius:18px;padding:24px 20px;text-align:left;box-shadow:0 4px 12px #00000012}.home-btn b{display:block;font-size:20px;margin-bottom:6px}.home-btn span{font-size:13px;opacity:.75}.home-btn.alt{background:#fff;color:#111;border:1px solid var(--line);box-shadow:none}.section-title{font-size:15px;font-weight:800;margin:20px 0 10px}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;outline:none}.btn{border:0;border-radius:12px;padding:11px 14px;background:#111;color:#fff;font-weight:700}.btn.light{background:#eee;color:#222}.btn.full{width:100%}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:4px}.item button{border:0;background:none;text-align:left;width:100%;padding:0}.camera{background:#111;border-radius:18px;overflow:hidden}.camera video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.camera-actions{display:flex;gap:8px;padding:10px}.camera-actions .btn{flex:1}.status{font-size:12px;color:var(--muted);margin:10px 0}.back{border:0;background:none;padding:0 0 8px;font-size:13px;color:var(--muted)}.product-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.brand{font-size:12px;color:var(--muted);font-weight:700}.product-name{font-size:19px;line-height:1.35;font-weight:850;margin:5px 0 12px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--soft)}.verified{background:#eaf7ee;color:#176b35}.pending{background:#fff5df;color:#8a5b00}.points{margin-top:14px;display:grid;gap:8px}.point{background:#f7f7f7;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.45}.point strong{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.caution{margin-top:12px;background:#fff7f7;border:1px solid #f1d6d6;color:#8b2d2d;border-radius:12px;padding:11px;font-size:12px;line-height:1.45}.compare-grid{display:grid;gap:10px;margin-top:12px}.compare{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.compare h3{margin:0 0 6px;font-size:14px}.compare p{margin:4px 0;font-size:12px;line-height:1.45}.concerns{display:flex;flex-wrap:wrap;gap:8px}.concern{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px}.concern.on{background:#111;color:#fff;border-color:#111}.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}.foot{padding:20px 18px;color:#999;font-size:10px;line-height:1.5}.link{color:#555;text-decoration:underline}.hidden{display:none!important}@media(min-width:700px){body{background:#e9e9e9}.app{background:var(--bg);box-shadow:0 0 40px #00000012}}
</style>
</head>
<body><main class="app">
<header class="top"><h1>올영 직원 도우미</h1><p>장승배기역점 · DA22 · 빠른 판매 보조</p></header>
<section id="home" class="screen">
<div class="home-grid"><button class="home-btn" onclick="show('find')"><b>📷 상품 찾기</b><span>바코드 → 상품명 검색 → 판매 포인트 → 비교</span></button><button class="home-btn alt" onclick="show('concern')"><b>🔎 고객 고민 찾기</b><span>고민 선택 → 성분 우선순위 → 추천 상품 → 비교</span></button></div>
<div class="section-title">MVP 범위</div><div class="item"><small>현재 50개 상품 중 검증 완료된 상품의 상세 분석을 우선 표시합니다. 검증 대기 상품은 상품 식별까지만 지원합니다.</small></div>
</section>
<section id="find" class="screen hidden"><button class="back" onclick="home()">← 홈</button><div class="section-title">상품 찾기</div>
<div class="camera"><video id="video" playsinline></video><div class="camera-actions"><button class="btn" onclick="startScan()">바코드 스캔</button><button class="btn light" onclick="stopScan()">카메라 끄기</button></div>
<div class="camera-actions"><label class="btn light" style="text-align:center">📸 사진으로 찾기<input id="photoInput" type="file" accept="image/*" capture="environment" hidden onchange="scanPhoto(this.files[0])"></label></div></div><div id="scanStatus" class="status">바코드 인식이 지원되는 브라우저에서는 카메라로 바로 찾을 수 있습니다.</div>
<div class="search"><input id="productSearch" placeholder="상품명 / 브랜드 / 바코드 검색"><button class="btn" onclick="searchProducts()">검색</button></div><div id="productResults" class="list" style="margin-top:10px"></div></section>
<section id="product" class="screen hidden"><button class="back" onclick="show('find')">← 상품 검색</button><div id="productDetail"></div></section>
<section id="concern" class="screen hidden"><button class="back" onclick="home()">← 홈</button><div class="section-title">고객 고민을 선택하세요</div><div id="concernList" class="concerns"></div><button class="btn full" style="margin-top:14px" onclick="recommend()">추천 결과 보기</button><div id="concernResults"></div></section>
<footer class="foot">본 도구는 직원 판매 보조용 MVP입니다. 화장품의 성분·효과를 의학적 진단이나 치료로 표현하지 않습니다. 재고는 수집 시점 데이터이며 실시간 재고를 보장하지 않습니다. <span id="sourceNote"></span></footer>
</main>
<script>
let DB={products:[],ingredients:[],concerns:[],product_ingredients:[],concern_ingredients:[],product_similarities:[]};let stream=null,scanTimer=null;
async function loadDB(){const r=await fetch('./oliveyoung_DA22_MVP_app_db_v1.json');DB=await r.json();document.getElementById('sourceNote').textContent=`DB ${DB.schema_version} · ${DB.products.length}개 MVP` ;renderConcerns()}
function $(id){return document.getElementById(id)}
function show(id){['home','find','product','concern'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='find') $('productSearch').focus()}
function home(){stopScan();show('home')}
function normalizeSearch(s){
  return String(s??'').toLowerCase().normalize('NFKC').replace(/[\s\-_/·•.,()[\]{}:;'"+=!?]+/g,'');
}
function searchTokens(q){
  return String(q??'').toLowerCase().normalize('NFKC').split(/\s+/).map(x=>x.trim()).filter(Boolean);
}
function tokenMatches(product, token){
  const t=normalizeSearch(token); if(!t)return true;
  const fields=[product.goodsName,product.brand,product.goodsNumber,String(product.barcode_master||''),product.barcodes_all,product.standard_category,product.sub_category,product.main_category,product.mvp_axis,product.customer_concerns,product.key_ingredients].map(normalizeSearch);
  if(fields.some(f=>f.includes(t)))return true;
  const aliases={
    '세럼':['세럼','serum','앰플','ampoule','에센스','essence'],
    '앰플':['앰플','ampoule','세럼','serum','에센스','essence'],
    '에센스':['에센스','essence','세럼','serum','앰플','ampoule'],
    '크림':['크림','cream'],'로션':['로션','lotion'],'토너':['토너','toner'],
    '패드':['패드','pad'],'클렌저':['클렌저','cleanser','폼','워시','wash']
  };
  const al=aliases[token.toLowerCase()];
  return al ? al.some(a=>fields.some(f=>f.includes(normalizeSearch(a)))) : false;
}
function subsequenceMatch(product, token){
  const t=normalizeSearch(token); if(!t||t.length<2)return false;
  const hay=[product.goodsName,product.brand,product.standard_category,product.sub_category,product.mvp_axis].map(normalizeSearch).join(' ');
  let i=0; for(const ch of hay){if(ch===t[i])i++;if(i===t.length)return true;} return false;
}
function searchScore(product,tokens){
  const fields=[product.goodsName,product.brand,product.goodsNumber,String(product.barcode_master||''),product.barcodes_all,product.standard_category,product.sub_category,product.mvp_axis,product.customer_concerns,product.key_ingredients].map(normalizeSearch);
  let score=0;
  for(const token of tokens){
    const t=normalizeSearch(token);
    if(fields.some(f=>f===t))score+=100;
    else if(fields.some(f=>f.includes(t)))score+=50;
    else if(tokenMatches(product,token))score+=35;
    else if(subsequenceMatch(product,token))score+=10;
  }
  return score;
}
function searchProducts(){
  const raw=$('productSearch').value.trim();
  if(!raw){$('productResults').innerHTML='<div class="empty">상품명, 브랜드 또는 바코드를 입력하세요.</div>';return}
  const tokens=searchTokens(raw);
  const a=DB.products.filter(p=>tokens.every(t=>tokenMatches(p,t)||subsequenceMatch(p,t))).map(p=>({p,score:searchScore(p,tokens)})).sort((a,b)=>b.score-a.score).slice(0,12).map(x=>x.p);
  $('productResults').innerHTML=a.length?a.map(p=>`<div class="item"><button onclick="openProduct('${p.goodsNumber}')"><b>${esc(p.brand)} · ${esc(cleanName(p.goodsName))}</b><small>${esc(p.standard_category||p.sub_category||'')} · ${p.verification_status==='verified'?'분석 완료':'상품 식별만 가능'}</small></button></div>`).join(''):'<div class="empty">찾는 상품이 없습니다.</div>';
}
function cleanName(s){return String(s).replace(/^\[[^\]]+\]\s*/,'').replace(/\s*기획.*$/,'').trim()}
function openProduct(id){stopScan();const p=DB.products.find(x=>x.goodsNumber===id);if(!p)return;show('product');const verified=p.verification_status==='verified';const similar=DB.product_similarities.filter(x=>x.product_id===id).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>DB.products.find(y=>y.goodsNumber===x.similar_product_id)).filter(Boolean);$('productDetail').innerHTML=`<div class="product-card"><div class="brand">${esc(p.brand)} · ${esc(p.standard_category||p.sub_category||'')}</div><div class="product-name">${esc(cleanName(p.goodsName))}</div><div class="tags"><span class="tag">${esc(p.mvp_axis)}</span><span class="tag ${verified?'verified':'pending'}">${verified?'✓ 분석 완료':'△ 검증 대기'}</span>${p.current_stock!==''?`<span class="tag">재고 ${esc(p.current_stock)}</span>`:''}</div>${verified?`<div class="points"><div class="point"><strong>핵심 성분</strong>${esc(p.key_ingredients)}</div><div class="point"><strong>고객에게 설명할 포인트</strong>${esc(p.selling_point_1)}</div><div class="point"><strong>한 줄 추가 포인트</strong>${esc(p.selling_point_2)}</div><div class="point"><strong>추천 고객</strong>${esc(p.customer_concerns)}</div><div class="point"><strong>제형</strong>${esc(p.texture)}</div></div>${p.caution?`<div class="caution">주의: ${esc(p.caution)}</div>`:''}`:`<div class="caution">현재 DB에서 성분·판매 포인트 검증이 완료되지 않은 상품입니다. 상품 식별만 제공하며 성분을 추정하지 않습니다.</div>`}<div class="section-title">비교하기 좋은 상품</div><div class="compare-grid">${similar.length?similar.map(s=>`<div class="compare"><h3>${esc(s.brand)} · ${esc(cleanName(s.goodsName))}</h3><p>${esc(s.key_ingredients||'성분 검증 대기')}</p><p>${esc(s.customer_concerns||s.selection_reason||'')}</p><button class="btn light" onclick="openProduct('${s.goodsNumber}')">이 상품 보기</button></div>`).join(''):'<div class="empty">아직 연결된 비교 상품이 없습니다.</div>'}</div></div>`}
function renderConcerns(){const names=DB.concerns.map(c=>c.name);$('concernList').innerHTML=names.map(n=>`<button class="concern" data-name="${esc(n)}" onclick="this.classList.toggle('on')">${esc(n)}</button>`).join('')}
function recommend(){const selected=[...document.querySelectorAll('.concern.on')].map(x=>x.dataset.name);if(!selected.length){$('concernResults').innerHTML='<div class="empty">고민을 1개 이상 선택하세요.</div>';return}const cmap=new Map(DB.concern_ingredients.map(x=>[x.concern_id,x]));const scores={};selected.forEach(c=>{DB.concern_ingredients.filter(x=>x.concern_id===c).forEach(x=>{scores[x.ingredient_id]=(scores[x.ingredient_id]||0)+Number(x.priority||1)})});const ing=[...Object.entries(scores)].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,score])=>({id,score,name:(DB.ingredients.find(i=>i.id===id)||{}).name_ko||id}));const pscore={};DB.product_ingredients.forEach(pi=>{if(scores[pi.ingredient_id])pscore[pi.product_id]=(pscore[pi.product_id]||0)+scores[pi.ingredient_id]});const products=Object.entries(pscore).sort((a,b)=>b[1]-a[1]).map(x=>DB.products.find(p=>p.goodsNumber===x[0])).filter(Boolean).slice(0,6);$('concernResults').innerHTML=`<div class="section-title">우선 성분</div><div class="tags">${ing.map(i=>`<span class="tag">${esc(i.name)} · ${i.score}점</span>`).join('')}</div><div class="section-title">추천 상품</div><div class="compare-grid">${products.length?products.map(p=>`<div class="compare"><h3>${esc(p.brand)} · ${esc(cleanName(p.goodsName))}</h3><p>${esc(p.key_ingredients||'')}</p><p>${esc(p.customer_concerns||'')}</p><button class="btn" onclick="openProduct('${p.goodsNumber}')">상세 보기</button></div>`).join(''):'<div class="empty">현재 매핑된 상품이 없습니다.</div>'}</div>`}
async function startScan(){
  stopScan();
  const status=$('scanStatus');
  if(!window.isSecureContext){
    status.innerHTML='⚠️ 카메라는 <b>HTTPS 주소</b>에서만 사용할 수 있습니다. iPhone에서 HTML 파일(file://)을 직접 연 경우 카메라가 작동하지 않습니다.';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent='⚠️ 이 환경에서는 웹 카메라 기능을 사용할 수 없습니다. 아래 📸 사진으로 찾기를 이용하세요.';
    return;
  }
  if(!window.ZXingBrowser){
    status.textContent='바코드 스캐너 모듈을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.';
    return;
  }
  try{
    status.textContent='카메라를 준비하는 중…';
    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    const controls=await reader.decodeFromConstraints(
      {video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},
      $('video'),
      (result,error)=>{
        if(result){
          const code=result.getText();
          $('productSearch').value=code;
          status.textContent='✅ 바코드 인식 완료';
          searchProducts();
          setTimeout(stopScan,250);
        }
      }
    );
    window.zxingControls=controls;
    stream=$('video').srcObject||null;
    status.textContent='📷 후면 카메라가 켜졌습니다. 바코드를 화면 가운데에 맞춰 주세요.';
  }catch(e){
    console.error(e);
    const name=e?.name||'';
    let msg='카메라를 시작하지 못했습니다.';
    if(name==='NotAllowedError')msg='⚠️ 카메라 접근이 차단되었습니다. Safari의 사이트별 카메라 권한이 허용인지 확인해 주세요.';
    else if(name==='NotFoundError')msg='⚠️ 사용할 수 있는 카메라를 찾지 못했습니다.';
    else if(name==='SecurityError')msg='⚠️ 보안 문제로 카메라를 사용할 수 없습니다. HTTPS 주소인지 확인해 주세요.';
    else if(name==='NotReadableError')msg='⚠️ 카메라가 다른 앱에서 사용 중일 수 있습니다. 카메라를 사용하는 앱을 닫고 다시 시도해 주세요.';
    status.textContent=msg;
  }
}
async function scanPhoto(file){
  if(!file)return;
  const status=$('scanStatus'); status.textContent='사진에서 바코드를 찾는 중…';
  try{
    if(!window.ZXingBrowser)throw new Error('ZXing unavailable');
    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    const url=URL.createObjectURL(file);
    try{
      const result=await reader.decodeFromImageUrl(url);
      const code=result.getText();
      $('productSearch').value=code;
      status.textContent='✅ 사진에서 바코드 인식 완료';
      searchProducts();
    }finally{URL.revokeObjectURL(url)}
  }catch(e){
    status.textContent='사진에서 바코드를 찾지 못했습니다. 현재는 아래 검색창을 이용해 주세요.';
  }
}
function stopScan(){
  if(window.zxingControls){try{window.zxingControls.stop()}catch(e){}window.zxingControls=null}
  if(scanTimer)cancelAnimationFrame(scanTimer);
  scanTimer=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if($('video').srcObject){try{$('video').srcObject.getTracks().forEach(t=>t.stop())}catch(e){}}
  $('video').srcObject=null;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
loadDB().catch(()=>{$('sourceNote').textContent='DB 로드 실패'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
